apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: picsou-finance
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
