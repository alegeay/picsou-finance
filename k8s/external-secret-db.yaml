apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: picsou-db-credentials
  namespace: picsou-finance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: picsou-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/kubernetes/picsou-db
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/kubernetes/picsou-db
        property: password
